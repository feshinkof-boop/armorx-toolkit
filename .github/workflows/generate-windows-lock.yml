name: Generate Windows frontend lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-windows-lock.yml"

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate package-lock.json
        working-directory: windows/frontend
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Validate lockfile
        working-directory: windows/frontend
        run: |
          test -s package-lock.json
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        with:
          name: armorx-windows-package-lock
          path: windows/frontend/package-lock.json
