name: Generate Windows frontend lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-windows-lock.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate and validate package-lock.json
        working-directory: windows/frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=moderate
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "build: add reproducible Windows frontend lockfile"
            git push origin HEAD:main
          fi
