name: Render Linux GUI previews

on:
  push:
    branches: [dev/v0.5.0-linux-gui]
    paths:
      - "scripts/render_linux_gui_previews.py"
      - "src/armorx/gui.py"
      - "src/armorx/gui_visual.py"
      - "src/armorx/gui_macro_widget.py"
      - "src/armorx/gui_macro_model.py"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.5.0-linux-gui
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install GUI renderer dependencies
        run: python -m pip install -e ".[gui]" Pillow
      - name: Render address-free previews
        run: python scripts/render_linux_gui_previews.py
      - name: Verify generated files
        run: |
          test -s docs/assets/linux/v0.5.0/05-stick-visuals.webp
          test -s docs/assets/linux/v0.5.0/06-trigger-visuals.webp
          test -s docs/assets/linux/v0.5.0/07-macro-timeline.webp
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for path in sorted(Path("docs/assets/linux/v0.5.0").glob("0[5-7]-*.webp")):
              with Image.open(path) as im:
                  assert im.width == 900
                  assert im.height > 300
                  print(path, im.size)
          PY
      - name: Commit updated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/linux/v0.5.0/05-stick-visuals.webp                   docs/assets/linux/v0.5.0/06-trigger-visuals.webp                   docs/assets/linux/v0.5.0/07-macro-timeline.webp
          if git diff --cached --quiet; then
            echo "Preview assets already current"
          else
            git commit -m "docs: refresh v0.5 Linux GUI visual previews"
            git push origin HEAD:dev/v0.5.0-linux-gui
          fi
