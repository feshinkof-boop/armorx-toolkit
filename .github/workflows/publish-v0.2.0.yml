name: Publish v0.2.0

on:
  push:
    branches:
      - release/publish-v0.2.0
    paths:
      - .github/workflows/publish-v0.2.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create tag and GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = "v0.2.0";
            const target = "71187dbbb34beeb794d698843bd9ea670685eaee";
            const name = "ArmorX Toolkit v0.2.0";
            const body = [
              "Second public release of the open-source BIGBIG WON ARMORX Pro toolkit.",
              "",
              "## Highlights",
              "",
              "- Added live-proven Guide / Xbox / Mode mapping as key ID `12`",
              "- Improved ARMOR-X Pro key mapping support",
              "- Corrected V41 macro wire serialization",
              "- Corrected `/dev/addMacro` `inUse` serialization to integer `0` / `1`",
              "- Preserved captured `showAdd=true` behavior for macro rows",
              "- Corrected structured config `res2` to raw bytes `74..111`",
              "- Expanded configuration, BLE protocol, key-mapping, and compatibility documentation",
              "- Continued support for Python 3.10, 3.11, 3.12, and 3.13",
              "",
              "## Existing toolkit features",
              "",
              "- 144-byte configuration decoder, validator, patcher, and builder",
              "- CRC16 validation and regeneration",
              "- Named Xbox / ARMOR-X Pro button mappings",
              "- M1-M4 remapping",
              "- Macro building, validation, and inspection",
              "- Timed macro steps, chords, and cycle modes",
              "- Read-oriented community/config exchange commands",
              "- Unknown/reserved config bytes preserved when patching known-good templates",
              "",
              "## Important scope note",
              "",
              "v0.2.0 is the public Python toolkit and CLI.",
              "",
              "The internal Windows research/capture application, Research Autopilot, raw BLE recorder, guided hardware experiments, evidence-bundle workflows, and researcher-only diagnostic/recovery UI are not part of this release.",
              "",
              "## Installation",
              "",
              "```bash",
              "python -m pip install git+https://github.com/feshinkof-boop/armorx-toolkit.git@v0.2.0",
              "armorx --version",
              "```",
              "",
              "Expected:",
              "",
              "```text",
              "armorx 0.2.0",
              "```",
              "",
              "## Compatibility",
              "",
              "- Python 3.10",
              "- Python 3.11",
              "- Python 3.12",
              "- Python 3.13",
              "",
              "## Notes",
              "",
              "ID `15` remains only a provisional Share / Capture / Screenshot candidate and is intentionally not exposed as a stable named mapping.",
              "",
              "Other unresolved IDs remain unnamed rather than guessed.",
              "",
              "This is an unofficial community project and is not affiliated with BIGBIG WON, MOJHON, Microsoft, or Xbox."
            ].join("\n");

            let ref;
            try {
              ref = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
              if (ref.data.object.sha !== target) {
                core.setFailed(`${tag} already exists at ${ref.data.object.sha}, expected ${target}`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: target
              });
            }

            try {
              const existing = await github.rest.repos.getReleaseByTag({owner, repo, tag});
              core.info(`Release already exists: ${existing.data.html_url}`);
            } catch (error) {
              if (error.status !== 404) throw error;
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: target,
                name,
                body,
                draft: false,
                prerelease: false,
                make_latest: "true"
              });
              core.info(`Created release: ${created.data.html_url}`);
            }
