name: Implement public Windows v0.2.1 safety layer

on:
  push:
    branches:
      - windows/public-v0.2.1
    paths:
      - ".github/workflows/implement-v0.2.1-safety.yml"
      - ".github/scripts/implement-v0.2.1-safety.py"

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: windows/public-v0.2.1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Apply v0.2.1 safety implementation
        run: python .github/scripts/implement-v0.2.1-safety.py

      - name: Public/research separation gate
        shell: pwsh
        run: |
          $text = (Get-ChildItem .\windows\ArmorX.Windows -Recurse -File | Get-Content -Raw) -join "`n"
          foreach ($needle in @("ResearchRecorder", "Research Autopilot", "AUTOPILOT_", "D2GuidedActions", "AE01", "repo-safe")) {
            if ($text -match [regex]::Escape($needle)) {
              throw "Research-only marker leaked into public v0.2.1 source: $needle"
            }
          }

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore .\windows\ArmorX.Windows\ArmorX.Windows.csproj
          dotnet build .\windows\ArmorX.Windows\ArmorX.Windows.csproj -c Release --no-restore

      - name: Publish validation executable
        shell: pwsh
        run: |
          dotnet publish .\windows\ArmorX.Windows\ArmorX.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o .\artifacts

      - name: Run self-test and WPF smoke test
        shell: pwsh
        run: |
          $exe = '.\artifacts\ArmorX-Windows.exe'
          $p = Start-Process $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Core self-test failed with exit code $($p.ExitCode)" }
          $p = Start-Process $exe -ArgumentList '--ui-smoke' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "WPF/XAML smoke test failed with exit code $($p.ExitCode)" }

      - name: Commit validated source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/ArmorX.Windows
          if (-not (git diff --cached --quiet)) {
            git commit -m "windows: add v0.2.1 backup diff and restore safety"
            git push origin HEAD:windows/public-v0.2.1
          }

      - name: Upload validated development artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorX-Windows-v0.2.1-safety-ci
          path: artifacts/ArmorX-Windows.exe
