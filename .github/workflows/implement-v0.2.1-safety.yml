name: Implement public Windows v0.2.1 safety layer

on:
  push:
    branches:
      - windows/public-v0.2.1
    paths:
      - ".github/workflows/implement-v0.2.1-safety.yml"

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: windows/public-v0.2.1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Add backup and config-diff safety services
        shell: pwsh
        run: |
          @'
          using System.Text.Json;
          using ArmorX.Windows.Config;

          namespace ArmorX.Windows.Profiles;

          public sealed class ArmorXBackup
          {
              public DateTimeOffset SavedUtc { get; set; } = DateTimeOffset.UtcNow;
              public string Reason { get; set; } = "pre-write";
              public string? DeviceModel { get; set; }
              public string? Firmware { get; set; }
              public string ConfigBase64 { get; set; } = string.Empty;
              public byte[] GetConfigBytes() => Convert.FromBase64String(ConfigBase64);
          }

          public sealed class BackupStore
          {
              private readonly JsonSerializerOptions _json = new() { WriteIndented = true };
              public string DirectoryPath { get; } = Path.Combine(
                  Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),
                  "ArmorX", "Backups");

              public BackupStore() => Directory.CreateDirectory(DirectoryPath);

              public async Task<string> SaveAsync(
                  ArmorXConfig144 config,
                  string? deviceModel,
                  string? firmware,
                  string reason)
              {
                  var backup = new ArmorXBackup
                  {
                      SavedUtc = DateTimeOffset.UtcNow,
                      Reason = reason,
                      DeviceModel = deviceModel,
                      Firmware = firmware,
                      ConfigBase64 = Convert.ToBase64String(config.ToArray())
                  };

                  var safeReason = string.Concat(reason.Select(ch =>
                      Path.GetInvalidFileNameChars().Contains(ch) ? '_' : ch));
                  var file = $"{backup.SavedUtc:yyyyMMdd-HHmmss-fff}-{safeReason}-crc-{config.StoredCrc:X4}.json";
                  var path = Path.Combine(DirectoryPath, file);
                  await File.WriteAllTextAsync(path, JsonSerializer.Serialize(backup, _json));
                  return path;
              }

              public async Task<ArmorXBackup?> LoadLatestAsync()
              {
                  foreach (var path in Directory.EnumerateFiles(DirectoryPath, "*.json")
                               .OrderByDescending(File.GetLastWriteTimeUtc))
                  {
                      try
                      {
                          var item = JsonSerializer.Deserialize<ArmorXBackup>(
                              await File.ReadAllTextAsync(path), _json);
                          if (item is not null && item.GetConfigBytes().Length == ArmorXConfig144.Size)
                              return item;
                      }
                      catch
                      {
                          // Ignore a damaged backup and try the next one.
                      }
                  }

                  return null;
              }
          }
          '@ | Set-Content .\windows\ArmorX.Windows\Profiles\BackupStore.cs -Encoding utf8

          @'
          namespace ArmorX.Windows.Config;

          public sealed record ConfigByteChange(int Offset, byte Before, byte After, string Label);

          public static class ConfigDiff
          {
              public static IReadOnlyList<ConfigByteChange> Compare(
                  ArmorXConfig144 before,
                  ArmorXConfig144 after,
                  bool includeCrc = false) =>
                  Compare(before.ToArray(), after.ToArray(), includeCrc);

              public static IReadOnlyList<ConfigByteChange> Compare(
                  byte[] before,
                  byte[] after,
                  bool includeCrc = false)
              {
                  if (before.Length != ArmorXConfig144.Size || after.Length != ArmorXConfig144.Size)
                      throw new ArgumentException("ARMOR-X Pro config diff requires two 144-byte images.");

                  var start = includeCrc ? 0 : 2;
                  var result = new List<ConfigByteChange>();
                  for (var i = start; i < ArmorXConfig144.Size; i++)
                  {
                      if (before[i] == after[i]) continue;
                      result.Add(new ConfigByteChange(i, before[i], after[i], LabelFor(i)));
                  }

                  return result;
              }

              public static ArmorXConfig144 MergeEditorChanges(
                  ArmorXConfig144 currentDevice,
                  byte[] editorBaseline,
                  ArmorXConfig144 editorDesired)
              {
                  if (editorBaseline.Length != ArmorXConfig144.Size)
                      throw new ArgumentException("Editor baseline must be 144 bytes.", nameof(editorBaseline));

                  var current = currentDevice.ToArray();
                  var desired = editorDesired.ToArray();

                  // Apply only semantic bytes changed in the editor since its last device baseline.
                  // This preserves any unrelated/reserved bytes that changed on the device meanwhile.
                  for (var i = 2; i < ArmorXConfig144.Size; i++)
                  {
                      if (editorBaseline[i] != desired[i])
                          current[i] = desired[i];
                  }

                  var merged = new ArmorXConfig144(current);
                  merged.RecalculateCrc();
                  return merged;
              }

              public static string FormatSummary(IReadOnlyList<ConfigByteChange> changes, int max = 18)
              {
                  if (changes.Count == 0) return "No semantic configuration changes are pending.";

                  var lines = new List<string>
                  {
                      $"{changes.Count} semantic byte change(s) will be written:",
                      ""
                  };

                  foreach (var change in changes.Take(max))
                      lines.Add($"Offset {change.Offset,3}  {change.Label,-24}  0x{change.Before:X2} -> 0x{change.After:X2}");

                  if (changes.Count > max)
                      lines.Add($"... and {changes.Count - max} more.");

                  lines.Add("");
                  lines.Add("CRC bytes 0-1 will be recalculated automatically.");
                  return string.Join(Environment.NewLine, lines);
              }

              private static string LabelFor(int offset)
              {
                  if (offset is >= 112 and <= 143) return $"mapKeys[{offset - 112}]";
                  return offset switch
                  {
                      4 => "motorSpeedIdx",
                      5 => "motorMax",
                      9 => "triggerMode",
                      10 => "triggerLeftCenter",
                      11 => "triggerLeftSide",
                      12 => "triggerRightCenter",
                      13 => "triggerRightSide",
                      14 => "circleLimit",
                      15 => "stickTurn",
                      16 => "leftDzCenter",
                      17 => "leftDzSide",
                      18 => "rightDzCenter",
                      19 => "rightDzSide",
                      >= 20 and <= 25 => $"leftCurve[{offset - 20}]",
                      >= 28 and <= 33 => $"rightCurve[{offset - 28}]",
                      36 => "sensorMode",
                      37 => "sensorDir",
                      38 => "sensorRightKey0",
                      39 => "sensorRightKey1",
                      >= 40 and <= 43 => "sensorRightKeyBit",
                      >= 44 and <= 49 => $"gyro0[{offset - 44}]",
                      >= 52 and <= 57 => $"gyro1[{offset - 52}]",
                      >= 60 and <= 65 => $"gyro2[{offset - 60}]",
                      68 => "sensorMin",
                      >= 69 and <= 72 => "sensorSwitch",
                      80 => "turboSpeedIdx",
                      >= 81 and <= 84 => "turboKey",
                      _ => "preserved/raw"
                  };
              }
          }
          '@ | Set-Content .\windows\ArmorX.Windows\Config\ConfigDiff.cs -Encoding utf8

      - name: Make editable config emit dirty-state notifications
        shell: pwsh
        run: |
          @'
          using System.Collections.ObjectModel;
          using ArmorX.Windows.Infrastructure;

          namespace ArmorX.Windows.Config;

          public sealed record MappingTarget(int Id, string Name)
          {
              public override string ToString() => $"{Name} ({Id})";
          }

          public sealed class ByteFieldViewModel : ObservableObject
          {
              private readonly ArmorXConfig144 _config;
              private readonly Action _changed;
              public string Label { get; }
              public int Offset { get; }

              public ByteFieldViewModel(string label, int offset, ArmorXConfig144 config, Action changed)
              {
                  Label = label;
                  Offset = offset;
                  _config = config;
                  _changed = changed;
              }

              public int Value
              {
                  get => _config.GetByte(Offset);
                  set
                  {
                      var clamped = Math.Clamp(value, 0, 255);
                      if (_config.GetByte(Offset) == clamped) return;
                      _config.SetByte(Offset, clamped);
                      RaisePropertyChanged();
                      _changed();
                  }
              }
          }

          public sealed class EditableArmorXConfig : ObservableObject
          {
              private readonly ArmorXConfig144 _config;
              public event EventHandler? Changed;

              public EditableArmorXConfig(ArmorXConfig144 config)
              {
                  _config = config;
                  LeftStickCurve = MakeCurve(20, "L");
                  RightStickCurve = MakeCurve(28, "R");
                  GyroCurve0 = MakeCurve(44, "G0");
                  GyroCurve1 = MakeCurve(52, "G1");
                  GyroCurve2 = MakeCurve(60, "G2");
              }

              public static IReadOnlyList<MappingTarget> ProvenMappingTargets { get; } = new[]
              {
                  new MappingTarget(0, "A"), new MappingTarget(1, "B"), new MappingTarget(2, "Clear"),
                  new MappingTarget(3, "X"), new MappingTarget(4, "Y"), new MappingTarget(6, "LB"),
                  new MappingTarget(7, "RB"), new MappingTarget(8, "LT"), new MappingTarget(9, "RT"),
                  new MappingTarget(10, "View"), new MappingTarget(11, "Menu"),
                  new MappingTarget(12, "Guide / Xbox"), new MappingTarget(13, "L3"), new MappingTarget(14, "R3"),
                  new MappingTarget(16, "D-pad Up"), new MappingTarget(17, "D-pad Down"),
                  new MappingTarget(18, "D-pad Left"), new MappingTarget(19, "D-pad Right"),
                  new MappingTarget(23, "M1"), new MappingTarget(24, "M2"),
                  new MappingTarget(25, "M3"), new MappingTarget(26, "M4")
              };

              public ObservableCollection<ByteFieldViewModel> LeftStickCurve { get; }
              public ObservableCollection<ByteFieldViewModel> RightStickCurve { get; }
              public ObservableCollection<ByteFieldViewModel> GyroCurve0 { get; }
              public ObservableCollection<ByteFieldViewModel> GyroCurve1 { get; }
              public ObservableCollection<ByteFieldViewModel> GyroCurve2 { get; }

              private ObservableCollection<ByteFieldViewModel> MakeCurve(int start, string prefix) =>
                  new(Enumerable.Range(0, 6).Select(i =>
                      new ByteFieldViewModel($"{prefix}{i + 1}", start + i, _config, NotifyChanged)));

              private int B(int offset) => _config.GetByte(offset);
              private void B(int offset, int value, string property)
              {
                  value = Math.Clamp(value, 0, 255);
                  if (_config.GetByte(offset) == value) return;
                  _config.SetByte(offset, value);
                  RaisePropertyChanged(property);
                  NotifyChanged();
              }

              private void NotifyChanged()
              {
                  RaisePropertyChanged(nameof(RawHex));
                  RaisePropertyChanged(nameof(CrcStatus));
                  Changed?.Invoke(this, EventArgs.Empty);
              }

              public int MotorSpeedIdx { get => B(4); set => B(4, value, nameof(MotorSpeedIdx)); }
              public int MotorMax { get => B(5); set => B(5, value, nameof(MotorMax)); }

              public int TriggerMode { get => B(9); set => B(9, value, nameof(TriggerMode)); }
              public int TriggerLeftDeadzoneCenter { get => B(10); set => B(10, value, nameof(TriggerLeftDeadzoneCenter)); }
              public int TriggerLeftDeadzoneSide { get => B(11); set => B(11, value, nameof(TriggerLeftDeadzoneSide)); }
              public int TriggerRightDeadzoneCenter { get => B(12); set => B(12, value, nameof(TriggerRightDeadzoneCenter)); }
              public int TriggerRightDeadzoneSide { get => B(13); set => B(13, value, nameof(TriggerRightDeadzoneSide)); }

              public int JoystickCircleLimit { get => B(14); set => B(14, value, nameof(JoystickCircleLimit)); }
              public int StickTurn { get => B(15); set => B(15, value, nameof(StickTurn)); }
              public int LeftStickDeadzoneCenter { get => B(16); set => B(16, value, nameof(LeftStickDeadzoneCenter)); }
              public int LeftStickDeadzoneSide { get => B(17); set => B(17, value, nameof(LeftStickDeadzoneSide)); }
              public int RightStickDeadzoneCenter { get => B(18); set => B(18, value, nameof(RightStickDeadzoneCenter)); }
              public int RightStickDeadzoneSide { get => B(19); set => B(19, value, nameof(RightStickDeadzoneSide)); }

              public int SensorMode { get => B(36); set => B(36, value, nameof(SensorMode)); }
              public int SensorDir { get => B(37); set => B(37, value, nameof(SensorDir)); }
              public int SensorRightKey0 { get => B(38); set => B(38, value, nameof(SensorRightKey0)); }
              public int SensorRightKey1 { get => B(39); set => B(39, value, nameof(SensorRightKey1)); }
              public int SensorMin { get => B(68); set => B(68, value, nameof(SensorMin)); }

              public uint SensorRightKeyBit
              {
                  get => _config.GetUInt32Be(40);
                  set
                  {
                      if (_config.GetUInt32Be(40) == value) return;
                      _config.SetUInt32Be(40, value);
                      RaisePropertyChanged();
                      NotifyChanged();
                  }
              }

              public uint SensorSwitch
              {
                  get => _config.GetUInt32Be(69);
                  set
                  {
                      if (_config.GetUInt32Be(69) == value) return;
                      _config.SetUInt32Be(69, value);
                      RaisePropertyChanged();
                      NotifyChanged();
                  }
              }

              public int TurboSpeedIdx { get => B(80); set => B(80, value, nameof(TurboSpeedIdx)); }
              public uint TurboKey
              {
                  get => _config.GetUInt32Be(81);
                  set
                  {
                      if (_config.GetUInt32Be(81) == value) return;
                      _config.SetUInt32Be(81, value);
                      RaisePropertyChanged();
                      NotifyChanged();
                  }
              }

              public int M1TargetId { get => _config.GetMapTarget(23); set => SetMap(23, value, nameof(M1TargetId)); }
              public int M2TargetId { get => _config.GetMapTarget(24); set => SetMap(24, value, nameof(M2TargetId)); }
              public int M3TargetId { get => _config.GetMapTarget(25); set => SetMap(25, value, nameof(M3TargetId)); }
              public int M4TargetId { get => _config.GetMapTarget(26); set => SetMap(26, value, nameof(M4TargetId)); }

              private void SetMap(int source, int value, string property)
              {
                  if (_config.GetMapTarget(source) == value) return;
                  _config.SetMapTarget(source, value);
                  RaisePropertyChanged(property);
                  NotifyChanged();
              }

              public string CrcStatus => _config.CrcValid
                  ? $"Valid 0x{_config.StoredCrc:X4}"
                  : $"Edited / will recalc (stored 0x{_config.StoredCrc:X4}, calc 0x{_config.CalculatedCrc:X4})";
              public string RawHex => _config.ToHex();

              public ArmorXConfig144 BuildForWrite()
              {
                  var copy = new ArmorXConfig144(_config.ToArray());
                  copy.RecalculateCrc();
                  return copy;
              }

              public byte[] RawBytes() => _config.ToArray();
          }
          '@ | Set-Content .\windows\ArmorX.Windows\Config\EditableArmorXConfig.cs -Encoding utf8

      - name: Patch public UI and safe-write workflow
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          xaml = Path("windows/ArmorX.Windows/MainWindow.xaml")
          s = xaml.read_text(encoding="utf-8")
          s = s.replace("Public configurator · v0.2.0", "Public configurator · v0.2.1")
          s = s.replace("Safe full-image write · read-back verified",
                        "Auto-backup · exact diff · read-back verified")
          old = '''                    <Button Style="{StaticResource SecondaryButton}" Margin="0,0,0,10" Content="Read from device" Click="ReadConfig_Click"/>
                    <Button Style="{StaticResource PrimaryButton}" Margin="0,0,0,10" Background="{StaticResource Success}" BorderBrush="{StaticResource Success}" Content="Apply &amp; Verify" Click="WriteVerify_Click"/>
                    <Button Style="{StaticResource DangerButton}" Margin="0" Content="Disconnect" Click="Disconnect_Click"/>'''
          new = '''                    <Button Style="{StaticResource SecondaryButton}" Margin="0,0,0,8" Content="Read from device" Click="ReadConfig_Click"/>
                    <Button Style="{StaticResource SecondaryButton}" Margin="0,0,0,8" Content="Review pending changes" Click="ReviewChanges_Click"/>
                    <Button Style="{StaticResource PrimaryButton}" Margin="0,0,0,8" Background="{StaticResource Success}" BorderBrush="{StaticResource Success}" Content="Apply &amp; Verify" Click="WriteVerify_Click"/>
                    <Button Style="{StaticResource SecondaryButton}" Margin="0,0,0,8" Content="Restore last backup" Click="RestoreLastBackup_Click"/>
                    <Button Style="{StaticResource DangerButton}" Margin="0" Content="Disconnect" Click="Disconnect_Click"/>'''
          if old not in s:
              raise SystemExit("Main action button block not found")
          s = s.replace(old, new)
          old_footer = '''            <Grid><Grid.ColumnDefinitions><ColumnDefinition/><ColumnDefinition Width="Auto"/></Grid.ColumnDefinitions><TextBlock Text="{Binding StatusText}"/><TextBlock Grid.Column="1" Foreground="{StaticResource TextSecondary}" Text="Unknown config bytes are preserved from the device image."/></Grid>'''
          new_footer = '''            <Grid>
                <Grid.ColumnDefinitions><ColumnDefinition/><ColumnDefinition Width="Auto"/></Grid.ColumnDefinitions>
                <StackPanel>
                    <TextBlock Text="{Binding StatusText}"/>
                    <TextBlock Text="{Binding SafetyText}" Foreground="{StaticResource TextSecondary}" FontSize="11" Margin="0,2,0,0"/>
                </StackPanel>
                <TextBlock Grid.Column="1" Foreground="{StaticResource TextSecondary}" VerticalAlignment="Center" Text="Unknown config bytes are preserved from the device image."/>
            </Grid>'''
          if old_footer not in s:
              raise SystemExit("Footer block not found")
          s = s.replace(old_footer, new_footer)
          xaml.write_text(s, encoding="utf-8")

          cs = Path("windows/ArmorX.Windows/MainWindow.xaml.cs")
          s = cs.read_text(encoding="utf-8")

          s = s.replace(
              "    private readonly ProfileStore _profileStore = new();\n",
              "    private readonly ProfileStore _profileStore = new();\n    private readonly BackupStore _backupStore = new();\n"
          )
          s = s.replace(
              '    private string _batteryText = "-";\n',
              '    private string _batteryText = "-";\n    private string _safetyText = "No device baseline loaded.";\n    private byte[]? _deviceBaseline;\n'
          )
          s = s.replace(
              "    public EditableArmorXConfig? Config { get => _config; private set => Set(ref _config, value); }\n",
              '''    public EditableArmorXConfig? Config
    {
        get => _config;
        private set
        {
            if (ReferenceEquals(_config, value)) return;
            if (_config is not null) _config.Changed -= Config_Changed;
            _config = value;
            if (_config is not null) _config.Changed += Config_Changed;
            OnPropertyChanged();
            UpdateDirtyState();
        }
    }
'''
          )
          s = s.replace(
              "    public string BatteryText { get => _batteryText; private set => Set(ref _batteryText, value); }\n",
              '    public string BatteryText { get => _batteryText; private set => Set(ref _batteryText, value); }\n    public string SafetyText { get => _safetyText; private set => Set(ref _safetyText, value); }\n'
          )

          old_connect = '''            var config = await session.ReadConfigAsync(cancellationToken);
            Config = new EditableArmorXConfig(config);
            StatusText = config.CrcValid
                ? $"Configuration loaded and verified · CRC 0x{config.StoredCrc:X4}."
                : $"Configuration loaded · CRC mismatch (stored 0x{config.StoredCrc:X4}).";'''
          new_connect = '''            var config = await session.ReadConfigAsync(cancellationToken);
            LoadDeviceConfig(config);
            StatusText = config.CrcValid
                ? $"Configuration loaded and verified · CRC 0x{config.StoredCrc:X4}."
                : $"Configuration loaded · CRC mismatch (stored 0x{config.StoredCrc:X4}).";'''
          if old_connect not in s:
              raise SystemExit("Connect config load block not found")
          s = s.replace(old_connect, new_connect)

          old_read = '''            var config = await _session.ReadConfigAsync();
            Config = new EditableArmorXConfig(config);
            StatusText = $"Configuration refreshed · CRC {(config.CrcValid ? "valid" : "invalid")} 0x{config.StoredCrc:X4}.";'''
          new_read = '''            var config = await _session.ReadConfigAsync();
            LoadDeviceConfig(config);
            StatusText = $"Configuration refreshed · CRC {(config.CrcValid ? "valid" : "invalid")} 0x{config.StoredCrc:X4}.";'''
          if old_read not in s:
              raise SystemExit("Read config load block not found")
          s = s.replace(old_read, new_read)

          start = s.index("    private async void WriteVerify_Click")
          end = s.index("    private async void SaveProfile_Click", start)
          replacement = r'''    private void ReviewChanges_Click(object sender, RoutedEventArgs e)
    {
        if (Config is null || _deviceBaseline is null)
        {
            MessageBox.Show("Read a configuration from the ARMOR-X Pro first.", "Review changes",
                MessageBoxButton.OK, MessageBoxImage.Information);
            return;
        }

        var desired = Config.BuildForWrite();
        var changes = ConfigDiff.Compare(_deviceBaseline, desired.ToArray());
        MessageBox.Show(ConfigDiff.FormatSummary(changes), "Pending configuration changes",
            MessageBoxButton.OK, changes.Count == 0 ? MessageBoxImage.Information : MessageBoxImage.Question);
    }

    private async void WriteVerify_Click(object sender, RoutedEventArgs e)
    {
        if (_session is null || Config is null || _deviceBaseline is null)
        {
            MessageBox.Show("Connect and read a configuration first. ArmorX Windows writes from the controller's own image so unknown bytes are preserved.",
                "ArmorX Windows", MessageBoxButton.OK, MessageBoxImage.Information);
            return;
        }

        await RunBusyAsync("Preparing safe write...", async () =>
        {
            // Re-read immediately before writing. This is the image we protect and merge onto.
            var current = await _session.ReadConfigAsync();
            var backupPath = await _backupStore.SaveAsync(current, _session.Model, _session.Firmware, "pre-write");

            var editorDesired = Config.BuildForWrite();
            var writeConfig = ConfigDiff.MergeEditorChanges(current, _deviceBaseline, editorDesired);
            var changes = ConfigDiff.Compare(current, writeConfig);

            if (changes.Count == 0)
            {
                _deviceBaseline = current.ToArray();
                SafetyText = $"No pending changes · backup saved: {Path.GetFileName(backupPath)}";
                StatusText = "Nothing to write.";
                return;
            }

            var prompt = ConfigDiff.FormatSummary(changes) +
                         Environment.NewLine + Environment.NewLine +
                         $"A full 144-byte backup was saved first:{Environment.NewLine}{backupPath}" +
                         Environment.NewLine + Environment.NewLine +
                         "Apply these changes, persist them, and verify all 144 bytes by reading the device back?";

            var answer = MessageBox.Show(prompt, "Review · Apply & Verify",
                MessageBoxButton.YesNo, MessageBoxImage.Question);
            if (answer != MessageBoxResult.Yes)
            {
                SafetyText = $"Write cancelled · backup saved: {Path.GetFileName(backupPath)}";
                StatusText = "Write cancelled. Device unchanged.";
                return;
            }

            StatusText = "Applying settings and verifying...";
            var result = await _session.WriteAndVerifyAsync(writeConfig);
            LoadDeviceConfig(result.ReadBackConfig);

            if (!result.ExactMatch)
            {
                StatusText = $"Verification failed · {result.MismatchOffsets.Count} byte(s) differ.";
                SafetyText = $"Pre-write backup available: {Path.GetFileName(backupPath)}";
                MessageBox.Show(
                    "The device read-back did not exactly match the requested configuration. The actual device image is now loaded into the editor. Use Restore last backup if needed.",
                    "ArmorX Windows", MessageBoxButton.OK, MessageBoxImage.Warning);
                return;
            }

            SafetyText = $"Verified · pre-write backup: {Path.GetFileName(backupPath)}";
            StatusText = $"Saved and verified · CRC 0x{result.ReadBackConfig.StoredCrc:X4}.";
            MessageBox.Show(
                "Settings saved successfully. The complete 144-byte read-back matches. A pre-write backup was kept automatically.",
                "ArmorX Windows", MessageBoxButton.OK, MessageBoxImage.Information);
        });
    }

    private async void RestoreLastBackup_Click(object sender, RoutedEventArgs e)
    {
        if (_session is null)
        {
            MessageBox.Show("Connect the ARMOR-X Pro first.", "Restore last backup",
                MessageBoxButton.OK, MessageBoxImage.Information);
            return;
        }

        await RunBusyAsync("Preparing backup restore...", async () =>
        {
            var targetBackup = await _backupStore.LoadLatestAsync();
            if (targetBackup is null)
            {
                MessageBox.Show("No automatic backup is available yet.", "Restore last backup",
                    MessageBoxButton.OK, MessageBoxImage.Information);
                StatusText = "No backup available.";
                return;
            }

            var target = new ArmorXConfig144(targetBackup.GetConfigBytes());
            var current = await _session.ReadConfigAsync();
            var changes = ConfigDiff.Compare(current, target);

            if (changes.Count == 0)
            {
                LoadDeviceConfig(current);
                StatusText = "The latest backup already matches the device.";
                return;
            }

            var prompt = ConfigDiff.FormatSummary(changes) +
                         Environment.NewLine + Environment.NewLine +
                         $"Backup date: {targetBackup.SavedUtc.LocalDateTime:G}" +
                         Environment.NewLine +
                         $"Backup reason: {targetBackup.Reason}" +
                         Environment.NewLine + Environment.NewLine +
                         "Restore this complete backed-up image and verify it by reading all 144 bytes back?";

            var answer = MessageBox.Show(prompt, "Restore last backup",
                MessageBoxButton.YesNo, MessageBoxImage.Warning);
            if (answer != MessageBoxResult.Yes)
            {
                StatusText = "Restore cancelled. Device unchanged.";
                return;
            }

            // Save the current state too. This makes restore reversible.
            var undoPath = await _backupStore.SaveAsync(current, _session.Model, _session.Firmware, "pre-restore");
            StatusText = "Restoring backup and verifying...";
            var result = await _session.WriteAndVerifyAsync(target);
            LoadDeviceConfig(result.ReadBackConfig);

            if (!result.ExactMatch)
            {
                SafetyText = $"Restore verification failed · previous state backed up: {Path.GetFileName(undoPath)}";
                StatusText = $"Restore verification failed · {result.MismatchOffsets.Count} byte(s) differ.";
                MessageBox.Show("Restore did not verify exactly. The actual device image is loaded in the editor.",
                    "Restore last backup", MessageBoxButton.OK, MessageBoxImage.Warning);
                return;
            }

            SafetyText = $"Backup restored and verified · undo backup: {Path.GetFileName(undoPath)}";
            StatusText = $"Backup restored and verified · CRC 0x{result.ReadBackConfig.StoredCrc:X4}.";
