name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system libraries for the GUI tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,gui]"
      - name: Smoke-test console command
        run: |
          armorx --version
          armorx config keys > /dev/null
          armorx macro keys > /dev/null
          armorx live --help > /dev/null
          armorx live apply --help > /dev/null
          armorx live rollback --help > /dev/null
          armorx-gui --version > /dev/null
          armorx-desktop --help > /dev/null
      - name: Run tests
        run: python -m pytest

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Python and Linux desktop release candidates
        run: |
          python -m pip install build
          ./scripts/build_linux_release.sh
      - name: Clean-install wheel and smoke-test
        run: |
          python -m venv /tmp/armorx-release-smoke
          /tmp/armorx-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/armorx-release-smoke/bin/python -m pip install dist/armorx_toolkit-0.5.0-py3-none-any.whl
          test "$(/tmp/armorx-release-smoke/bin/armorx --version)" = "armorx 0.5.0"
          /tmp/armorx-release-smoke/bin/armorx config keys > /dev/null
          /tmp/armorx-release-smoke/bin/armorx live --help > /dev/null
          /tmp/armorx-release-smoke/bin/armorx live apply --help > /dev/null
          /tmp/armorx-release-smoke/bin/armorx live rollback --help > /dev/null
          /tmp/armorx-release-smoke/bin/armorx-gui --version > /dev/null
          /tmp/armorx-release-smoke/bin/armorx-desktop --help > /dev/null
          /tmp/armorx-release-smoke/bin/armorx-desktop --applications-dir /tmp/armorx-applications install
          test -s /tmp/armorx-applications/io.github.feshinkof_boop.armorx-toolkit.desktop
          grep -q 'python.*-m armorx.gui' /tmp/armorx-applications/io.github.feshinkof_boop.armorx-toolkit.desktop
          /tmp/armorx-release-smoke/bin/armorx-desktop --applications-dir /tmp/armorx-applications uninstall
      - name: Inspect Linux desktop bundle
        run: |
          test -s dist/ArmorX-Toolkit-Linux-v0.5.0.tar.gz
          test -s dist/ArmorX-Toolkit-Linux-v0.5.0-SHA256SUMS.txt
          tar -tzf dist/ArmorX-Toolkit-Linux-v0.5.0.tar.gz | grep -q 'ArmorX-Toolkit-Linux-v0.5.0/install.sh'
          tar -tzf dist/ArmorX-Toolkit-Linux-v0.5.0.tar.gz | grep -q 'armorx_toolkit-0.5.0-py3-none-any.whl'
          (cd dist && sha256sum -c ArmorX-Toolkit-Linux-v0.5.0-SHA256SUMS.txt)
      - name: Upload release-candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armorx-v0.5.0-release-candidate
          path: |
            dist/armorx_toolkit-0.5.0-py3-none-any.whl
            dist/armorx_toolkit-0.5.0.tar.gz
            dist/ArmorX-Toolkit-Linux-v0.5.0.tar.gz
            dist/ArmorX-Toolkit-Linux-v0.5.0-SHA256SUMS.txt
