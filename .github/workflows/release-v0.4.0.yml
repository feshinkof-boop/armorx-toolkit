name: Publish v0.4.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build release assets
        run: |
          python -m pip install build
          python -m build
          git archive --format=zip --prefix="ArmorX-Toolkit-v0.4.0/" -o dist/ArmorX-Toolkit-v0.4.0-source.zip "$GITHUB_SHA"
          sha256sum             dist/armorx_toolkit-0.4.0-py3-none-any.whl             dist/armorx_toolkit-0.4.0.tar.gz             dist/ArmorX-Toolkit-v0.4.0-source.zip             > dist/ArmorX-Toolkit-v0.4.0-SHA256SUMS.txt
      - name: Clean-install release wheel
        run: |
          python -m venv /tmp/armorx-release-smoke
          /tmp/armorx-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/armorx-release-smoke/bin/python -m pip install dist/armorx_toolkit-0.4.0-py3-none-any.whl
          test "$(/tmp/armorx-release-smoke/bin/armorx --version)" = "armorx 0.4.0"
          /tmp/armorx-release-smoke/bin/armorx live --help > /dev/null
          /tmp/armorx-release-smoke/bin/armorx live apply --help > /dev/null
          /tmp/armorx-release-smoke/bin/armorx live rollback --help > /dev/null
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0 >/dev/null 2>&1; then
            echo "v0.4.0 already exists; leaving it untouched"
            exit 0
          fi
          gh release create v0.4.0             --target "$GITHUB_SHA"             --title "ArmorX Toolkit v0.4.0 — Linux BLE Configuration"             --notes-file RELEASE_NOTES_v0.4.0.md             dist/armorx_toolkit-0.4.0-py3-none-any.whl             dist/armorx_toolkit-0.4.0.tar.gz             dist/ArmorX-Toolkit-v0.4.0-source.zip             dist/ArmorX-Toolkit-v0.4.0-SHA256SUMS.txt
