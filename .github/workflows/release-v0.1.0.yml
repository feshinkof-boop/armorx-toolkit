name: Publish v0.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.1.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create v0.1.0 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already exists; nothing to do."
            exit 0
          fi

          gh release create v0.1.0 \
            --target "$GITHUB_SHA" \
            --title "ArmorX Toolkit v0.1.0" \
            --notes-file RELEASE_NOTES_v0.1.0.md \
            --latest
