name: Publish v0.5.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install package and tests
        run: python -m pip install -e ".[dev,gui]"
      - name: Run tests
        run: python -m pytest

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build release assets
        run: |
          python -m pip install build
          ./scripts/build_linux_release.sh
      - name: Clean-install wheel and launcher smoke
        run: |
          python -m venv /tmp/armorx-v050-release
          /tmp/armorx-v050-release/bin/python -m pip install --upgrade pip
          /tmp/armorx-v050-release/bin/python -m pip install dist/armorx_toolkit-0.5.0-py3-none-any.whl
          test "$(/tmp/armorx-v050-release/bin/armorx --version)" = "armorx 0.5.0"
          /tmp/armorx-v050-release/bin/armorx-gui --version > /dev/null
          /tmp/armorx-v050-release/bin/armorx-desktop --applications-dir /tmp/armorx-applications install
          test -s /tmp/armorx-applications/io.github.feshinkof_boop.armorx-toolkit.desktop
          /tmp/armorx-v050-release/bin/armorx-desktop --applications-dir /tmp/armorx-applications uninstall
          (cd dist && sha256sum -c ArmorX-Toolkit-Linux-v0.5.0-SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.0 >/dev/null 2>&1; then
            echo "v0.5.0 already exists; leaving it untouched"
            exit 0
          fi
          gh release create v0.5.0             --target "$GITHUB_SHA"             --title "ArmorX Toolkit v0.5.0 — Linux Desktop Configurator"             --notes-file RELEASE_NOTES_v0.5.0.md             dist/armorx_toolkit-0.5.0-py3-none-any.whl             dist/armorx_toolkit-0.5.0.tar.gz             dist/ArmorX-Toolkit-Linux-v0.5.0.tar.gz             dist/ArmorX-Toolkit-Linux-v0.5.0-SHA256SUMS.txt
