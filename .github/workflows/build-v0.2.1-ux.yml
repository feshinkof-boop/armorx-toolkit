name: Build v0.2.1 UX
on:
  push:
    branches: [windows/public-v0.2.1]
    paths:
      - ".github/scripts/implement-v0.2.1-ux.py"
      - ".github/workflows/build-v0.2.1-ux.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: windows/public-v0.2.1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: python .github/scripts/implement-v0.2.1-ux.py
      - shell: pwsh
        run: |
          dotnet restore .\windows\ArmorX.Windows\ArmorX.Windows.csproj
          dotnet build .\windows\ArmorX.Windows\ArmorX.Windows.csproj -c Release --no-restore
          dotnet publish .\windows\ArmorX.Windows\ArmorX.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\artifacts
          $p = Start-Process .\artifacts\ArmorX-Windows.exe -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "self-test failed" }
          $p = Start-Process .\artifacts\ArmorX-Windows.exe -ArgumentList '--ui-smoke' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "ui-smoke failed" }
      - shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/ArmorX.Windows
          if (-not (git diff --cached --quiet)) {
            git commit -m "windows: add v0.2.1 profile and diagnostics UX"
            git push origin HEAD:windows/public-v0.2.1
          }
