name: Bug report
description: Report a reproducible problem with an ArmorX Toolkit command
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve ArmorX Toolkit.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact command and a minimal anonymized input if possible.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
  - type: input
    id: firmware
    attributes:
      label: ARMORX Pro firmware
  - type: textarea
    id: output
    attributes:
      label: Output / traceback
