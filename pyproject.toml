[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "armorx-toolkit"
version = "0.1.0"
description = "Open-source BIGBIG WON ARMORX Pro tooling for Xbox controller configs, key mapping and macros"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
  "bigbigwon",
  "bigbig-won",
  "armorx",
  "armorx-pro",
  "xbox",
  "xbox-controller",
  "controller",
  "gamepad",
  "keymapping",
  "controller-remapping",
  "macro",
  "reverse-engineering",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]

[project.scripts]
armorx = "armorx.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
